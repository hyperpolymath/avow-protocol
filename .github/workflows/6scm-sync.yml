# SPDX-License-Identifier: MPL-2.0
name: 6SCM Mirror Check

on:
  push:
    paths:
      - '.machine_readable/**'
  pull_request:
    paths:
      - '.machine_readable/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check 6scm mirrors
        run: bash scripts/check-6scm.sh
